<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>External site title</title>
    <script src="https://masternaut--testers.sandbox.my.salesforce.com/lightning/lightning.out.latest/index.iife.prod.js"></script>
    <style>
        c-lightning-out-job-briefing-wrapper.loaded{
                background-color:#ffffff;
                height: 70vh !important;

        }
    </style>
</head>
<body>
    <h1>External site element 1</h1>
    <button id="loginButton">
        Login with Salesforce
    </button>

    <lightning-out-application
        id="loApp"
        app-id="1Us9Z00000001VZSAY"
        components="c-lightning-out-job-briefing-wrapper">
    </lightning-out-application>

    <c-lightning-out-job-briefing-wrapper> </c-lightning-out-job-briefing-wrapper>
    <h3>External site element 2</h3>

    <div id="flowLoaderSection">
        <label>Flow API Name <input type="text" id="flowApiNameInput" value="Case_Job_Brief" /></label>
        <label>Case Number <input type="text" id="caseNumberInput" placeholder="e.g. 00001234" /></label>
        <button id="loadFlowButton" disabled>Load Flow</button>
    </div>
    <p id="photoStatus"></p>

    <div id="photoModal" class="modal-backdrop" hidden>
        <div class="modal-box">
            <h3 id="photoModalTitle">Take photo</h3>
            <input type="file" id="photoModalInput" accept="image/*" capture="environment" />
            <div class="modal-actions">
                <button id="photoModalCancel" type="button">Cancel</button>
                <button id="photoModalUpload" type="button">Upload</button>
            </div>
        </div>
    </div>

    <style>
        #flowLoaderSection label { display: block; margin: 6px 0; }
        .modal-backdrop {
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.5);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 1000;
        }
        .modal-backdrop[hidden] {
            display: none !important;
        }
        .modal-box {
            background: #fff;
            border-radius: 8px;
            padding: 20px;
            min-width: 280px;
        }
        .modal-actions { margin-top: 12px; display: flex; gap: 8px; justify-content: flex-end; }
    </style>


    <script>
    //Main script
    // Salesforce configuration

    const SF_DOMAIN =
        "https://masternaut--testers.sandbox.my.salesforce.com";

    const CLIENT_ID =
        "3MVG9gW1gj2XrUw2VaydyJZTZfD8jSffU2i2BY.3_KtlfE3zE1bKZGUAKCFqx6vpUI8luKVu2sc2fAjYFhksm";

    //For serverside call to avoid CORS limitations of salesforce
    const WORKER_URL =
        "https://yellow-night-4510.basit-ali.workers.dev/";

    const REDIRECT_URI =
        window.location.origin + window.location.pathname;
    // To expand height on load
    function expandLightningComponent(){

        const component = document.querySelector( "c-lightning-out-job-briefing-wrapper" );
        if(component){
            component.classList.add("loaded");
            console.log("Lightning component expanded");
        }
    }

    // Create a random PKCE code verifier

    function generateVerifier() {

        const chars =
            "ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789";

        let result = "";

        const random =
            crypto.getRandomValues( new Uint8Array(64) );

        random.forEach(x => { result += chars[x % chars.length]; });

        return result;
    }

    // Create the SHA-256 PKCE code challenge

    async function generateChallenge(verifier) {

        const data =
            new TextEncoder().encode(verifier);

        const hash =
            await crypto.subtle.digest(  "SHA-256", data);

        return btoa( String.fromCharCode( ...new Uint8Array(hash) ) ).replace(/\+/g, "-").replace(/\//g, "_").replace(/=/g, "");
        }

    // Redirect the user to Salesforce for login

    document
    .getElementById("loginButton")
    .onclick = async function () {
        const verifier = generateVerifier();
        sessionStorage.setItem("pkce_verifier", verifier);
        const challenge =  await generateChallenge(verifier);
        const loginUrl = SF_DOMAIN + "/services/oauth2/authorize?" +
            new URLSearchParams({
                response_type: "code",
                client_id: CLIENT_ID,
                redirect_uri: REDIRECT_URI,
                code_challenge: challenge,
                code_challenge_method: "S256"
            });
        window.location.href = loginUrl;
    };

    // Wire up the flow-loader UI and the photo-upload round trip. Listeners are
    // attached to the static element reference now; the element itself is only
    // upgraded into the real LWC once Lightning Out boots (after frontdoorUrl is set),
    // but the DOM node reference is stable so the listeners still catch events
    // dispatched later.
    (function setupFlowLoaderAndPhotoModal() {
        const component = document.querySelector("c-lightning-out-job-briefing-wrapper");
        const flowApiNameInput = document.getElementById("flowApiNameInput");
        const caseNumberInput = document.getElementById("caseNumberInput");
        const loadFlowButton = document.getElementById("loadFlowButton");
        const statusEl = document.getElementById("photoStatus");

        const photoModal = document.getElementById("photoModal");
        const photoModalTitle = document.getElementById("photoModalTitle");
        const photoModalInput = document.getElementById("photoModalInput");
        const photoModalCancel = document.getElementById("photoModalCancel");
        const photoModalUpload = document.getElementById("photoModalUpload");
        let currentPhotoName = null;

        loadFlowButton.onclick = function () {
            const flowApiName = flowApiNameInput.value.trim();
            const caseNumber = caseNumberInput.value.trim();
            if (!flowApiName || !caseNumber) {
                statusEl.textContent = "Enter a flow API name and a case number first.";
                return;
            }
            statusEl.textContent = `Loading ${flowApiName} for case ${caseNumber}…`;
            component.dispatchEvent(
                new CustomEvent("loadflow", {
                    detail: { flowApiName, caseNumber },
                    bubbles: true,
                    composed: true
                })
            );
            document.getElementById("flowLoaderSection").hidden = true;
        };

        // The LWC asks us (the host page) to actually take/pick a photo for a
        // named requirement it doesn't know how to capture itself.
        component.addEventListener("requestphotoupload", function (event) {
            currentPhotoName = event.detail.photoName;
            photoModalTitle.textContent = `Take photo: ${currentPhotoName}`;
            photoModalInput.value = "";
            photoModal.hidden = false;
        });

        photoModalCancel.onclick = function () {
            photoModal.hidden = true;
            currentPhotoName = null;
        };

        // Camera photos can be several MB at full resolution, and that's too
        // large for the Aura remote-action round trip (it fails with a generic
        // "aura:systemError" rather than a clean Apex error). Downscale/re-encode
        // via canvas first so the base64 payload stays small.
        function resizeImageToBase64(file, maxDimension, quality) {
            return new Promise(function (resolve, reject) {
                const objectUrl = URL.createObjectURL(file);
                const img = new Image();
                img.onload = function () {
                    URL.revokeObjectURL(objectUrl);
                    let { width, height } = img;
                    if (width > maxDimension || height > maxDimension) {
                        const scale = maxDimension / Math.max(width, height);
                        width = Math.round(width * scale);
                        height = Math.round(height * scale);
                    }
                    const canvas = document.createElement("canvas");
                    canvas.width = width;
                    canvas.height = height;
                    canvas.getContext("2d").drawImage(img, 0, 0, width, height);
                    resolve(canvas.toDataURL("image/jpeg", quality).split(",")[1]);
                };
                img.onerror = function () {
                    URL.revokeObjectURL(objectUrl);
                    reject(new Error("Could not load the selected photo."));
                };
                img.src = objectUrl;
            });
        }

        photoModalUpload.onclick = async function () {
            const file = photoModalInput.files[0];
            if (!file) {
                statusEl.textContent = "Choose a photo first.";
                return;
            }

            statusEl.textContent = `Preparing ${file.name}…`;
            let base64Data;
            try {
                base64Data = await resizeImageToBase64(file, 1280, 0.7);
            } catch (err) {
                statusEl.textContent = "Could not read the selected photo.";
                return;
            }

            const fileName = file.name.replace(/\.[^.]+$/, "") + ".jpg";
            statusEl.textContent = `Sending ${currentPhotoName} to the LWC…`;
            component.dispatchEvent(
                new CustomEvent("photoready", {
                    detail: {
                        photoName: currentPhotoName,
                        fileName: fileName,
                        base64Data: base64Data
                    },
                    bubbles: true,
                    composed: true
                })
            );
            photoModal.hidden = true;
            currentPhotoName = null;
        };

        component.addEventListener("photouploadresult", function (event) {
            const { success, photoName, fileName, contentDocumentLinkId, error } = event.detail;
            statusEl.textContent = success
                ? `Uploaded ${fileName} for "${photoName}" (ContentDocumentLink: ${contentDocumentLinkId})`
                : `Failed to upload ${fileName} for "${photoName}": ${error}`;
        });
    })();

    // Handle the OAuth callback from Salesforce
    (async function () {
        // Read the authorization code from the URL
        const params = new URLSearchParams(window.location.search);

        const code = params.get("code");
        if (!code) {
            return;
        }

        // Retrieve the PKCE verifier used during login
        const verifier = sessionStorage.getItem("pkce_verifier");

        // Exchange the authorization code for an access token
        const tokenResponse =
            await fetch(
                SF_DOMAIN +
                "/services/oauth2/token",
                {
                    method: "POST",
                    headers: {
                        "Content-Type":
                            "application/x-www-form-urlencoded"
                    },
                    body:
                        new URLSearchParams({

                            grant_type: "authorization_code",
                            client_id: CLIENT_ID,
                            code: code,

                            redirect_uri: REDIRECT_URI,

                            code_verifier: verifier

                        })
                }
            );


        const token =  await tokenResponse.json();
        console.log( "Token response",  token);

        if (!token.access_token) {
            alert( JSON.stringify(token));
            return;
        }

        // Remove the OAuth code from the browser address bar
        window.history.replaceState({}, document.title, window.location.pathname);

        // Get a Lightning Out frontdoor URL from the Cloudflare Worker

        const fdResponse =
            await fetch(
                WORKER_URL,
                {
                    method: "POST",
                    headers: {
                        "Content-Type":
                            "application/json"
                    },
                    body:
                        JSON.stringify({
                            access_token:
                                token.access_token
                        })
                }
            );


        const frontdoor =
            await fdResponse.json();


        console.log(
            "Frontdoor response",
            frontdoor
        );

        // Pass the frontdoor URL to Lightning Out

        if (frontdoor.frontdoor_uri) {
            document.getElementById("loApp").frontdoorUrl = frontdoor.frontdoor_uri;
            // Expand component height after Salesforce session is ready
            expandLightningComponent();
            // Only now is the Lightning Out app booted and the LWC upgraded/ready to receive events.
            document.getElementById("loadFlowButton").disabled = false;
            document.getElementById("loginButton").hidden = true;
        }
        else {
            alert(
                JSON.stringify(frontdoor)
            );
        }
    })();

</script>

</body>
</html>
